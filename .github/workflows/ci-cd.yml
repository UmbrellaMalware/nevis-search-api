name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          tags: nevis-search-api-tests
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ruff, mypy, pytest (against pgvector)
        run: >
          docker compose --profile test run --rm tests
          sh -c "ruff check . && ruff format --check . && mypy app tests && pytest -v"

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

  build:
    name: Build and push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /opt/nevis-search-api
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key: no blind trust-on-first-use from CI.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config

      - name: Upload compose files
        run: |
          ssh target "mkdir -p $DEPLOY_DIR"
          scp docker-compose.yml docker-compose.prod.yml "target:$DEPLOY_DIR/"

      - name: Pull and restart
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh target "bash -s" <<EOF
          set -euo pipefail
          cd "$DEPLOY_DIR"
          test -f .env || { echo ".env is missing on the server"; exit 1; }
          printf 'IMAGE=%s\nIMAGE_TAG=%s\n' "$IMAGE" "$IMAGE_TAG" > .image.env
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          compose() { docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env --env-file .image.env "\$@"; }
          compose pull
          compose up -d --no-build --remove-orphans
          docker image prune -f >/dev/null
          EOF

      - name: Health check (public HTTPS endpoint, through Traefik)
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://$DOMAIN/health"; then echo; exit 0; fi
            sleep 3
          done
          ssh target "cd $DEPLOY_DIR && docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env --env-file .image.env logs --tail 50"
          exit 1
